<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Larutan & Benda Mengapung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background: #061326;
      display: grid;
      place-items: center;
    }

    /* Container Background Larutan */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.22), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(20, 184, 166, 0.18), transparent 50%),
        linear-gradient(180deg, #071933 0%, #0b294d 55%, #06152b 100%);
    }

    /* Gelombang / lapisan larutan bergerak */
    .fluid-wave {
      position: absolute;
      left: -25%;
      width: 150%;
      height: 55%;
      border-radius: 42% 58% 48% 52% / 35% 45% 55% 65%;
      filter: blur(28px);
      opacity: 0.45;
      will-change: transform;
    }

    .wave-1 {
      top: 12%;
      background: radial-gradient(circle at 30% 40%, #38bdf8, #0284c7 65%, transparent);
      animation: driftWave1 14s ease-in-out infinite alternate;
    }

    .wave-2 {
      bottom: -8%;
      background: radial-gradient(circle at 70% 50%, #2dd4bf, #0369a1 70%, transparent);
      animation: driftWave2 18s ease-in-out infinite alternate;
    }

    /* Permukaan atas larutan (meniskus halus) */
    .liquid-surface {
      position: absolute;
      top: 26%;
      left: -10%;
      width: 120%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(186, 230, 253, 0.45), rgba(125, 211, 252, 0.7), rgba(186, 230, 253, 0.45), transparent);
      filter: blur(0.6px);
      animation: surfaceRipple 7s ease-in-out infinite;
    }

    /* Gelembung larutan naik */
    .bubble {
      position: absolute;
      bottom: -40px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.65), rgba(125, 211, 252, 0.18) 60%, rgba(56, 189, 248, 0.05));
      border: 1px solid rgba(224, 242, 254, 0.35);
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity;
      animation: riseBubble var(--dur, 10s) linear var(--delay, 0s) infinite;
    }

    /* Benda yang mengapung di larutan */
    .floater {
      position: absolute;
      top: var(--top, 28%);
      left: var(--left, 20%);
      will-change: transform;
      animation: floatBob var(--bob-dur, 5.5s) ease-in-out var(--delay, 0s) infinite;
    }

    .floater-body {
      display: block;
      animation: floatTilt var(--tilt-dur, 7s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes driftWave1 {
      0%   { transform: translate3d(-4%, -2%, 0) rotate(-3deg) scale(1); }
      100% { transform: translate3d(5%, 4%, 0) rotate(4deg) scale(1.08); }
    }

    @keyframes driftWave2 {
      0%   { transform: translate3d(4%, 3%, 0) rotate(3deg) scale(1.05); }
      100% { transform: translate3d(-5%, -3%, 0) rotate(-4deg) scale(0.98); }
    }

    @keyframes surfaceRipple {
      0%, 100% { transform: translateY(0px) scaleY(1); opacity: 0.55; }
      50%      { transform: translateY(6px) scaleY(1.4); opacity: 0.9; }
    }

    @keyframes riseBubble {
      0% {
        transform: translate3d(0, 0, 0) scale(0.85);
        opacity: 0;
      }
      12% {
        opacity: 0.75;
      }
      50% {
        transform: translate3d(var(--sway, 18px), -50vh, 0) scale(1);
        opacity: 0.65;
      }
      88% {
        opacity: 0.35;
      }
      100% {
        transform: translate3d(calc(var(--sway, 18px) * -0.6), -108vh, 0) scale(0.9);
        opacity: 0;
      }
    }

    @keyframes floatBob {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50%      { transform: translate3d(10px, -14px, 0); }
    }

    @keyframes floatTilt {
      0%, 100% { transform: rotate(-5deg); }
      50%      { transform: rotate(6deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fluid-wave, .liquid-surface, .bubble, .floater, .floater-body {
        animation: none !important;
      }
    }

    /* Contoh konten di atas background */
    .demo-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px 32px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(186, 230, 253, 0.2);
    }
    .demo-content h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .demo-content p { font-size: 0.9rem; color: #bae6fd; }
  </style>
</head>
<body>
  <div class="liquid-bg" id="liquid-bg" aria-hidden="true">
    <div class="fluid-wave wave-1"></div>
    <div class="fluid-wave wave-2"></div>
    <div class="liquid-surface"></div>

    <!-- Contoh Benda Mengapung (Gabus, Kapsul/Pelampung, Kubus) -->
    <div class="floater" style="--top: 23%; --left: 16%; --bob-dur: 5.2s; --tilt-dur: 6.8s; --delay: 0s;">
      <svg class="floater-body" width="54" height="32" viewBox="0 0 54 32">
        <rect x="4" y="6" width="46" height="20" rx="6" fill="#d97706" stroke="#fbbf24" stroke-width="1.5" />
        <ellipse cx="27" cy="6" rx="23" ry="3.5" fill="#f59e0b" opacity="0.7" />
      </svg>
    </div>

    <div class="floater" style="--top: 25%; --left: 74%; --bob-dur: 6.4s; --tilt-dur: 8s; --delay: -1.8s;">
      <svg class="floater-body" width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="16" fill="#38bdf8" fill-opacity="0.28" stroke="#7dd3fc" stroke-width="1.5" />
        <circle cx="18" cy="18" r="4" fill="#ffffff" fill-opacity="0.45" />
      </svg>
    </div>

    <div class="floater" style="--top: 22%; --left: 48%; --bob-dur: 7.1s; --tilt-dur: 6.2s; --delay: -3.2s;">
      <svg class="floater-body" width="44" height="44" viewBox="0 0 44 44">
        <rect x="10" y="10" width="24" height="24" rx="5" fill="#34d399" fill-opacity="0.75" stroke="#a7f3d0" stroke-width="1.5" />
      </svg>
    </div>
  </div>

  <main class="demo-content">
    <h1>Simulasi Larutan Mengapung</h1>
    <p>Lapisan cairan, gelembung, dan benda terapung berjalan halus di latar belakang.</p>
  </main>

  <script>
    // Menghasilkan gelembung larutan secara ringan
    const bg = document.getElementById("liquid-bg");
    const bubbleCount = 16;

    for (let i = 0; i < bubbleCount; i++) {
      const b = document.createElement("span");
      b.className = "bubble";
      const size = Math.round(8 + Math.random() * 18);
      b.style.width = `${size}px`;
      b.style.height = `${size}px`;
      b.style.left = `${Math.round(Math.random() * 96)}%`;
      b.style.setProperty("--dur", `${(7 + Math.random() * 8).toFixed(1)}s`);
      b.style.setProperty("--delay", `${(-Math.random() * 12).toFixed(1)}s`);
      b.style.setProperty("--sway", `${Math.round((Math.random() - 0.5) * 44)}px`);
      bg.appendChild(b);
    }
  </script>
</body>
</html>
